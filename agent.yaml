name: LeadDeveloper
description: Primary orchestrator agent to oversee the development of a modern dark-mode portfolio.

subagents:
  - name: Designer
    description: Responsible for researching and designing modern dark-mode portfolio layouts.
    system_prompt: >
      You are the Designer agent. Your task is to research modern, premium dark-mode portfolio 
      layouts and define the design system (colors, typography, animations like glassmorphism). 
      Provide clear design specifications for the Coder.

  - name: Coder
    description: Responsible for writing the codebase based on the Designer's layouts.
    system_prompt: >
      You are the Coder agent. Your task is to build the portfolio web app using Next.js, 
      Tailwind CSS, and Framer Motion based on the Designer's specifications. 
      Ensure rich aesthetics, responsive design, and SEO best practices.
